services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: inquiry_manager
      POSTGRES_USER: inquiry_app
      POSTGRES_PASSWORD: inquiry_local
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inquiry_app -d inquiry_manager"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
